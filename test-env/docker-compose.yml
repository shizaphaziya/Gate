services:
  gate-test-linux:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gate-test-linux
    privileged: true
    restart: unless-stopped
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    ports:
      - "2222:22"
      - "5050:5050"
    tmpfs:
      - /run
      - /run/lock
      - /tmp
